<style>
  body {
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    min-height: 100vh;
    padding-top: 0;
    background: #141119;
    text-align: center;
    overflow: hidden;
  }

  .error-container {
    position: relative;
    z-index: 2;
    padding: 40px 20px;
    animation: fadeUp 0.8s ease forwards;
  }

  .error-code {
    font-family: 'Fraunces', Georgia, serif;
    font-style: italic;
    font-size: clamp(100px, 20vw, 180px);
    font-weight: 600;
    line-height: 1;
    color: #e0895a;
    letter-spacing: -2px;
  }

  .error-title {
    font-family: 'Fraunces', Georgia, serif;
    font-size: clamp(22px, 4vw, 36px);
    font-weight: 600;
    color: #f3ece0;
    margin: 10px 0 15px;
    letter-spacing: -0.3px;
  }

  .error-desc {
    color: rgba(243,236,224,0.65);
    font-size: 16px;
    max-width: 400px;
    margin: 0 auto 40px;
    line-height: 1.7;
  }

  .error-actions {
    display: flex;
    gap: 15px;
    justify-content: center;
    flex-wrap: wrap;
  }

  .btn-primary, .btn-secondary {
    display: inline-block;
    padding: 14px 36px;
    border-radius: 3px;
    text-decoration: none;
    font-weight: 600;
    font-size: 13px;
    text-transform: uppercase;
    letter-spacing: 1px;
    transition: background 0.3s ease, color 0.3s ease;
  }

  .btn-primary {
    background: #e0895a;
    border: 1px solid #e0895a;
    color: #17140f;
  }

  .btn-primary:hover {
    background: transparent;
    color: #e0895a;
  }

  .btn-secondary {
    background: transparent;
    border: 1px solid rgba(243,236,224,0.3);
    color: #f3ece0;
  }

  .btn-secondary:hover {
    background: rgba(243,236,224,0.08);
  }

  .divider {
    width: 44px;
    height: 2px;
    background: #e0895a;
    margin: 0 auto 25px;
  }

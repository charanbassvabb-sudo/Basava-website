              - { label: "Text", name: "text", widget: "text" }
          - label: "Why Choose Us"
            name: "why"
            widget: "list"
            summary: "{{title}}"
            fields:
              - { label: "Title", name: "title", widget: "string" }
              - { label: "Text", name: "text", widget: "text" }
          - label: "Testimonials"
            name: "testimonials"
            widget: "list"
            summary: "{{name}}"
            required: false
            hint: "⭐ Add a real client quote to switch on the 'What Our Clients Say' section on this page. Leave empty and it stays hidden — never shows placeholder text."
            fields:
              - { label: "Quote", name: "quote", widget: "text" }
              - { label: "Client Name", name: "name", widget: "string" }
              - { label: "Business / Role", name: "role", widget: "string" }
              - { label: "Star Rating", name: "stars", widget: "number", default: 5, min: 1, max: 5, value_type: "int" }
          - label: "Team"
            name: "team"
            widget: "list"
            summary: "{{name}} — {{role}}"
            hint: "Team members shown as photo cards. Clicking a card on the live site opens their bio in a popup."
            fields:
              - { label: "Photo", name: "image", widget: "image" }
              - { label: "Name", name: "name", widget: "string" }
              - { label: "Role", name: "role", widget: "string" }
              - { label: "Bio (shown in popup)", name: "bio", widget: "text" }
              - { label: "Show as larger photo", name: "large", widget: "boolean", required: false, default: false }
          - label: "Call To Action"
            name: "cta"
            widget: "object"
            fields:

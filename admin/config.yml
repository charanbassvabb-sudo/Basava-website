              - { label: "Text", name: "text", widget: "text" }
          - label: "Core Values"
            name: "values"
            widget: "list"
            summary: "{{title}}"
            hint: "Add, remove, or reorder freely."
            fields:
              - { label: "Title", name: "title", widget: "string" }
              - { label: "Text", name: "text", widget: "text" }
          - label: "Stats"
            name: "stats"
            widget: "list"
            summary: "{{number}} — {{label}}"
            fields:
              - { label: "Number", name: "number", widget: "string" }
              - { label: "Label", name: "label", widget: "string" }
          - label: "Why Choose Us"
            name: "why"
            widget: "list"
            summary: "{{title}}"
            fields:
              - { label: "Title", name: "title", widget: "string" }
              - { label: "Text", name: "text", widget: "text" }
          - label: "Call To Action"
            name: "cta"
            widget: "object"
            fields:
              - { label: "Title", name: "title", widget: "string" }
              - { label: "Text", name: "text", widget: "text" }

  # ------------------------------------------------------------------
  - name: "contact_page"
    label: "✉️ Contact Page"
    files:
      - name: "contact"
        label: "Contact Page Content"
        file: "content/contact.json"
        fields:

              - { label: "Title", name: "title", widget: "string" }
              - { label: "Subtitle", name: "subtitle", widget: "string" }
          - label: "Contact Info"
            name: "info"
            widget: "object"
            fields:
              - { label: "Address", name: "address", widget: "string", hint: "📍 Also automatically moves the interactive map and the 'Get Directions' button futher down this same page." }
              - { label: "Email (Enterprises & Trust)", name: "emailEnterprisesTrust", widget: "string" }
              - { label: "Email (Associates)", name: "emailAssociates", widget: "string" }
              - { label: "Phone", name: "phone", widget: "string" }
              - { label: "WhatsApp Link", name: "whatsapp", widget: "string", hint: "Full link, e.g. https://wa.me/260966328089" }
              - { label: "Note under the form", name: "note", widget: "string" }
          - label: "Call To Action"
            name: "cta"
            widget: "object"
            fields:
              - { label: "Title", name: "title", widget: "string" }
              - { label: "Text", name: "text", widget: "text" }

  # ------------------------------------------------------------------
  - name: "companies_page"
    label: "🏢 Companies (overview) Page"
    files:
      - name: "companies"
        label: "Companies Page Content"

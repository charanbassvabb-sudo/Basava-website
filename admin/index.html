<!doctype html>
<html>
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Basava Group — Content Admin</title>
  <meta name="robots" content="noindex, nofollow" />
  <link rel="icon" href="../MainLogo.png" />

  <style>
    /* Branded loading screen — shown while the editor (a large JS app)
       downloads and starts up, so the first thing anyone sees is the
       Basava Group brand rather than a blank white page. It removes
       itself automatically once the editor has mounted. */
    #admin-splash {
      position: fixed;
      inset: 0;
      z-index: 99999;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 18px;
      background: linear-gradient(135deg, #070014, #0d0030, #070014);
      color: #fff;
      font-family: 'Poppins', Arial, sans-serif;
      transition: opacity 0.5s ease;
    }
    #admin-splash img {
      width: 96px;
      height: 96px;
      object-fit: contain;
      filter: drop-shadow(0 0 30px rgba(0, 195, 255, 0.35));
      animation: admin-pulse 2.2s ease-in-out infinite;
    }
    #admin-splash .admin-splash-title {
      font-size: 18px;
      font-weight: 600;
      letter-spacing: 0.3px;
    }
    #admin-splash .admin-splash-sub {
      font-size: 13px;
      color: rgba(255, 255, 255, 0.55);
    }
    #admin-splash .admin-splash-bar {
      width: 160px;
      height: 3px;
      border-radius: 3px;
      background: rgba(255, 255, 255, 0.12);
      overflow: hidden;
    }
    #admin-splash .admin-splash-bar::after {
      content: "";
      display: block;
      width: 40%;
      height: 100%;
      background: linear-gradient(90deg, #00c3ff, #0073b7);
      border-radius: 3px;
      animation: admin-loading 1.3s ease-in-out infinite;
    }
    @keyframes admin-pulse {
      0%, 100% { transform: scale(1); opacity: 1; }
      50% { transform: scale(1.06); opacity: 0.85; }
    }
    @keyframes admin-loading {
      0% { transform: translateX(-100%); }
      100% { transform: translateX(350%); }
    }
    #admin-splash.admin-splash-hide {
      opacity: 0;
      pointer-events: none;
    }
  </style>

  <!-- Netlify Identity (handles the admin login) -->
  <script src="https://identity.netlify.com/v1/netlify-identity-widget.js"></script>
</head>
<body>

  <div id="admin-splash">
    <img src="../MainLogo.png" alt="Basava Group" />
    <div class="admin-splash-title">Basava Group Content Admin</div>
    <div class="admin-splash-bar"></div>
    <div class="admin-splash-sub">Loading the editor…</div>
  </div>

  <!-- Decap CMS (the editor UI itself) -->
  <script src="https://unpkg.com/decap-cms@^3.0.0/dist/decap-cms.js"></script>
  <script>
    // Redirect the Netlify Identity confirmation link back into /admin
    if (window.netlifyIdentity) {
      window.netlifyIdentity.on("init", (user) => {
        if (!user) {
          window.netlifyIdentity.on("login", () => {
            document.location.href = "/admin/";
          });
        }
      });
    }

    // Hide the branded splash once Decap CMS has mounted its UI into the
    // page (it injects its own root element as a sibling of #admin-splash).
    // A short fallback timeout guarantees the splash never gets stuck.
    (function () {
      var splash = document.getElementById("admin-splash");
      if (!splash) return;
      function hideSplash() {
        splash.classList.add("admin-splash-hide");
        setTimeout(function () { splash.remove(); }, 600);
      }
      var observer = new MutationObserver(function () {
        if (document.body.children.length > 1) {
          observer.disconnect();
          hideSplash();
        }
      });
      observer.observe(document.body, { childList: true });
      setTimeout(hideSplash, 6000); // safety net
    })();
  </script>
</body>
</html>
